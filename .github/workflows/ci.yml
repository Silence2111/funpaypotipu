name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gamemarket/db generate

      - name: Build packages
        run: pnpm --filter @gamemarket/shared --filter @gamemarket/db build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamemarket
          POSTGRES_PASSWORD: gamemarket
          POSTGRES_DB: gamemarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gamemarket"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://gamemarket:gamemarket@localhost:5432/gamemarket?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      DATA_ENCRYPTION_KEY: ci-encryption-key
      MOCK_WEBHOOK_SECRET: ci-webhook-secret
      API_PORT: 4000
      API_URL: http://localhost:4000
      # Таймеры сделок раз в 2 с: e2e проверяет, что фоновая задача снимает истёкшее продвижение.
      ORDER_SWEEP_INTERVAL_MS: 2000
      # Автоподнятие раз в 2 с: e2e проверяет, что лот поднимается сам.
      AUTO_RAISE_INTERVAL_MS: 2000
      # Сохранённые поиски раз в 2 с: e2e ждёт уведомления о новом лоте.
      SAVED_SEARCH_INTERVAL_MS: 2000
      # Цены в избранном раз в 2 с: e2e ждёт уведомления о снижении.
      PRICE_DROP_INTERVAL_MS: 2000
      # Скидки раз в 2 с: e2e ждёт, что цена вернётся по сроку.
      SALE_SWEEP_INTERVAL_MS: 2000
      # Подписки на продавцов раз в 2 с: e2e ждёт уведомления о новом лоте и скидке.
      FOLLOW_INTERVAL_MS: 2000
      # Ожидание поступления раз в 2 с: e2e ждёт уведомления, что лот снова в продаже.
      STOCK_WATCH_INTERVAL_MS: 2000
      # Вход через Яндекс ID и VK ID — против тестового сервера из e2e (apps/api/test/oauth-mock.mjs).
      OAUTH_TEST_ISSUER: http://localhost:4999
      YANDEX_CLIENT_ID: ci-yandex
      YANDEX_CLIENT_SECRET: ci-yandex-secret
      VK_CLIENT_ID: ci-vk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gamemarket/db generate
      - run: pnpm --filter @gamemarket/shared --filter @gamemarket/db build
      - run: pnpm --filter @gamemarket/api build

      # База — в московском поясе, как бывает у управляемого Postgres в России:
      # время в сыром SQL без utc() уезжает на 3 часа, и e2e это ловит. В UTC
      # такие ошибки не видны (часть 103 в ПРОДУКТ/ДОВОДКА.md).
      - name: Пояс базы — Europe/Moscow
        env:
          PGPASSWORD: gamemarket
        run: |
          psql -h localhost -U gamemarket -d gamemarket -c "ALTER DATABASE gamemarket SET timezone TO 'Europe/Moscow'"
          test "$(psql -h localhost -U gamemarket -d gamemarket -tAc 'SHOW timezone')" = "Europe/Moscow"

      - name: Migrate + seed
        run: |
          pnpm --filter @gamemarket/db exec prisma migrate deploy
          pnpm --filter @gamemarket/db seed

      - name: Start API
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 40); do curl -sf http://localhost:4000/api/health && break; sleep 1; done

      - name: E2E (money paths)
        run: node apps/api/test/e2e.mjs

  # Боевой стек с нуля, как на чистом VPS (docs/12-deploy.md): образы по
  # apps/*/Dockerfile, infra/compose.prod.yaml, проверка снаружи через Caddy,
  # бэкап и восстановление из него. Раньше образы не собирались ни разу.
  stack:
    runs-on: ubuntu-latest
    env:
      C: docker compose -f infra/compose.prod.yaml --env-file infra/.env.production
    steps:
      - uses: actions/checkout@v4

      - name: Окружение прода для проверки
        run: |
          cat > infra/.env.production <<EOF
          PUBLIC_URL=http://localhost
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_ACCESS_SECRET=$(openssl rand -hex 32)
          JWT_REFRESH_SECRET=$(openssl rand -hex 32)
          DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)
          PAYMENT_PROVIDER=mock
          MOCK_WEBHOOK_SECRET=$(openssl rand -hex 16)
          BACKUP_DIR=./backups
          HEALTH_INTERVAL=5
          EOF

      - name: Сборка образов
        run: $C build

      - name: Запуск с нуля
        run: |
          $C up -d
          for i in $(seq 1 90); do curl -sf http://localhost/api/health/ready >/dev/null && curl -sf http://localhost/ >/dev/null && break; sleep 2; done
          $C ps

      # Стек с нуля — как первый запуск на сервере: только сид каталога, лотов нет.
      - name: Пустой каталог
        run: bash infra/ops/empty-catalog.sh http://localhost

      - name: Проверка снаружи
        run: SMOKE_KEY_FILE=/tmp/smoke-key bash infra/ops/smoke.sh http://localhost

      - name: Бэкап и восстановление
        run: |
          $C exec -T backup /ops/backup.sh
          dump=$(ls infra/backups/db-*.dump | tail -n1)
          files=$(ls infra/backups/uploads-*.tar.gz | tail -n1)
          # В архиве файлов — фото из проверки.
          tar -tzf "$files" | grep -q "$(cat /tmp/smoke-key)"
          # Восстановление — в отдельную базу рядом: те же пользователи и лоты, что в рабочей.
          $C exec -T -e RESTORE_DB=gamemarket_check backup /ops/restore.sh "/backups/$(basename "$dump")"
          q() { $C exec -T postgres psql -U gamemarket -d "$1" -tAc "$2"; }
          # Сид и проверка заполняют эти таблицы — они не пустые; остальные сверяются числом.
          for t in users profiles games categories fee_rules roles listings orders; do
            a=$(q gamemarket "SELECT count(*) FROM $t"); b=$(q gamemarket_check "SELECT count(*) FROM $t")
            echo "$t: $a → $b"; [ "$a" = "$b" ]
            case $t in listings|orders) ;; *) [ "$a" -gt 0 ] ;; esac
          done
          # Пользователь из проверки — и в восстановленной базе.
          q gamemarket_check "SELECT count(*) FROM profiles WHERE username LIKE 'smoke%'" | grep -qx 1

      - name: Копия бэкапа вне сервера
        run: |
          # Хранилище S3 — временный «rclone serve s3» в той же сети (образов MinIO на
          # Docker Hub больше нет); проверяет его отдельный клиент — официальный aws-cli.
          net=$(docker network ls --format '{{.Name}}' | grep 'gamemarket-prod_default')
          # Ключи — в формате AWS (20 и 40 знаков): короткие rclone serve s3 не принимает.
          AK=AKIAGAMEMARKETCI0001; SK=gamemarketcisecretkey0000000000000000001
          docker run -d --name s3 --network "$net" rclone/rclone:1.69.1 serve s3 --auth-key "$AK,$SK" --addr :8080 /data
          aws() {
            docker run --rm --network "$net" -e AWS_ACCESS_KEY_ID=$AK -e AWS_SECRET_ACCESS_KEY=$SK -e AWS_DEFAULT_REGION=us-east-1 \
              --entrypoint sh amazon/aws-cli:latest -c "aws configure set default.s3.addressing_style path && aws --endpoint-url http://s3:8080 $*"
          }
          for i in $(seq 1 30); do aws s3 mb s3://gm-backups && break; sleep 2; done
          $C exec -T -e BACKUP_S3_ENDPOINT=http://s3:8080 -e BACKUP_S3_BUCKET=gm-backups \
            -e BACKUP_S3_ACCESS_KEY=$AK -e BACKUP_S3_SECRET_KEY=$SK backup /ops/backup.sh | tee /tmp/offsite.log
          grep -q 'вне сервера: offsite:gm-backups/gamemarket' /tmp/offsite.log
          aws s3 ls s3://gm-backups/gamemarket/ | tee /tmp/offsite-ls.txt
          grep -q 'db-.*\.dump' /tmp/offsite-ls.txt && grep -q 'uploads-.*\.tar\.gz' /tmp/offsite-ls.txt

      - name: Сторож видит старый бэкап
        run: |
          sudo touch -d '2 days ago' infra/backups/.last-ok
          for i in $(seq 1 12); do $C logs healthwatch | grep -q 'бэкапа не было' && break; sleep 5; done
          $C logs healthwatch | grep 'бэкапа не было'

      - name: Проверка выката — только чтение
        run: |
          before=$($C exec -T postgres psql -U gamemarket -d gamemarket -tAc 'SELECT count(*) FROM users')
          SMOKE_READONLY=1 bash infra/ops/smoke.sh http://localhost
          after=$($C exec -T postgres psql -U gamemarket -d gamemarket -tAc 'SELECT count(*) FROM users')
          echo "users: $before → $after"; [ "$before" = "$after" ]

      - name: Сторож видит падение
        run: |
          $C stop web
          for i in $(seq 1 12); do $C logs healthwatch | grep -q 'сайт не отвечает' && break; sleep 5; done
          $C logs healthwatch | grep 'сайт не отвечает'
          $C start web

      - name: Прод без секретов не стартует
        run: |
          set +e
          docker run --rm -e NODE_ENV=production -e SKIP_DOTENV=1 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/db gamemarket-api:local node dist/main.js
          code=$?
          echo "exit $code"; test "$code" -ne 0

      # Сколько памяти занимает стек под нагрузкой проверок: по нему — размер сервера.
      - name: Память стека
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'

      - name: Журналы
        if: always()
        run: $C logs --tail 150
